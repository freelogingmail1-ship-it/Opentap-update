 const {data}=await sb.from('comments').select('*,profiles!comments_user_id_fkey(id,username,full_name,avatar_url,verified,badge_visible,last_seen),comment_reactions(user_id,type)').eq('post_id',id).order('created_at');
 const all=(data||[]).filter(c=>!hid(c.user_id));
 const item=(c,rep)=>{reg(c.profiles);const my=c.comment_reactions.find(r=>r.user_id==me.id),n=c.comment_reactions.length,root=c.parent_id||c.id;
  const rt=rep?(all.find(x=>x.user_id==c.reply_to)?.profiles||all.find(x=>x.id==c.parent_id)?.profiles):null;
  const hb=!my?ic('heart',18):my.type=='❤️'?`<span style="color:#ff2e7e">${ic('heart',18,'currentColor')}</span>`:`<span style="font-size:16px;line-height:18px">${my.type}</span>`;
  return `<div style="display:flex;gap:10px;padding:8px 0;${rep?'margin-left:20px;padding-left:12px;border-left:2px solid var(--bd)':''}">${av(c.profiles,rep?'sm':'')}<div style="flex:1;min-width:0">

  <button class="p" style="align-self:flex-start;flex-direction:column;gap:0" onpointerdown="lpS(${c.id},'c',this)" onpointerup="lpE()" onpointerleave="lpE()" oncontextmenu="return false" onclick="hClick(${c.id},'c')">${hb}<small class="mu">${n||''}</small></button></div>`};
 $('#cl').innerHTML=all.filter(c=>!c.parent_id).map(c=>item(c,0)+all.filter(r=>r.parent_id==c.id).map(r=>item(r,1)).join('')).join('')||'<p class="mu" style="padding:14px 0">No comments yet. Be the first to comment.</p>';
 const l=$('#cl');l.scrollTop=end?l.scrollHeight:st0}
function replyC(root,uid){replyTo={id:root,uid};const rb=$('#rb');rb.style.display='block';rb.innerHTML=`Replying to <b>${nm(PM[uid])}</b> · <span style="cursor:pointer;text-decoration:underline" onclick="cancelR()">Cancel</span>`;$('#ci').focus()}
function cancelR(){replyTo=null;$('#rb').style.display='none'}
async function sendC(id){const b=$('#ci').value.trim();if(!b)return;
 const {error}=await sb.from('comments').insert({post_id:id,user_id:me.id,body:b,parent_id:replyTo?replyTo.id:null,reply_to:replyTo?replyTo.uid:null});
 if(error)return toast(error.message);$('#ci').value='';$('#ci').style.height='auto';cancelR();loadC(id,true);refreshPost(id)}

// ---------- UPLOAD ----------
function add(){shell('New post',`<div class="pad"><textarea id="cap" rows="4" placeholder="What is on your mind? Write a caption, share a link, or add a photo or video." style="font-size:16px"></textarea>
 <div id="pv" class="post" style="margin:8px 0 6px;min-height:150px;display:grid;place-items:center;border:2px dashed var(--bd);cursor:pointer" onclick="choose()"><div class="mu" style="text-align:center">${ic('cam',38)}<br>Add a photo or video (optional)</div></div>
 <div class="mu" id="hd" style="margin:2px 4px 12px">You can post only a caption. Photos and videos upload in HD, with no compression.</div><button id="pb" style="width:100%;padding:14px" onclick="publish()">Share post</button></div>`)}
let file;async function choose(){file=await pick('image/*,video/*');if(!file)return;const u=URL.createObjectURL(file);
 $('#pv').style.border='0';$('#pv').innerHTML=file.type.startsWith('video')?`<video class="media" src="${u}" controls></video>`:`<img class="media" src="${u}">`;
 $('#hd').innerHTML='HD · original quality · '+(file.size/1048576).toFixed(1)+' MB · <a href="#" style="color:#ff2e7e;font-weight:700" onclick="clearFile();return false">Remove</a>'}
function clearFile(){file=null;$('#pv').style.border='2px dashed var(--bd)';$('#pv').innerHTML=`<div class="mu" style="text-align:center">${ic('cam',38)}<br>Add a photo or video (optional)</div>`;$('#hd').textContent='You can post only a caption. Photos and videos upload in HD, with no compression.'}
async function publish(){const cap=$('#cap').value.trim();if(!file&&!cap)return toast('Add a caption, photo or video');$('#pb').textContent='Posting…';$('#pb').disabled=true;
 let url=null;if(file){url=await upload(file);if(!url){$('#pb').disabled=false;$('#pb').textContent='Share post';return}}
 const {error}=await sb.from('posts').insert({user_id:me.id,media_url:url,media_type:file?(file.type.startsWith('video')?'video':'image'):null,caption:cap});
 file=null;if(error){toast(error.message);$('#pb').disabled=false;$('#pb').textContent='Share post'}else go('feed')}

function searchPage(){shell('Search',`<div class="pad"><div style="position:relative"><input id="sq2" placeholder="Search by username or name" oninput="srch2(this.value)" style="padding-left:44px" autocomplete="off" autocapitalize="none"><span style="position:absolute;left:14px;top:19px;color:var(--mu)">${ic('search',18)}</span></div></div><div id="sl" style="margin-top:8px"></div>`);$('#sq2').focus();srch2('')}
async function srch2(q){q=q.trim().replace(/[%,()]/g,'');let r=sb.from('profiles').select('*').limit(30);if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);const {data}=await r;

const gLetter=g=>e((g.name[0]||'G').toUpperCase());

 const {data}=await sb.from('group_members').select('role,groups(id,name,approval,owner_id,group_members(count))').eq('user_id',me.id);
 const L=(data||[]).filter(x=>x.groups);L.forEach(x=>GR[x.groups.id]=x.groups);MG=new Set(L.map(x=>x.groups.id));

async function gfind(q){q=q.trim().replace(/[%,()]/g,'');const el=$('#gres');if(!q){el.innerHTML='';return}
 const {data}=await sb.from('groups').select('id,name,approval,owner_id').ilike('name','%'+q+'%').limit(20);
 el.innerHTML=(data||[]).map(g=>{GR[g.id]=GR[g.id]||g;const m=MG.has(g.id);return `<div class="row" style="cursor:default"><div class="gi" style="border-radius:50%">${gLetter(g)}</div><div style="flex:1;min-width:0"><div class="nm">${e(g.name)}</div><div class="mu">${g.approval?'Admin approval required':'Anyone can join'}</div></div>${m?`<button class="g" style="padding:8px 14px" onclick="groupChat('${g.id}')">Open</button>`:`<button style="padding:8px 14px" onclick="joinG('${g.id}',this)">${g.approval?'Request':'Join'}</button>`}</div>`}).join('')||'<p class="empty">No groups found</p>'}
async function joinG(id,b){const {data,error}=await sb.rpc('join_group',{p_gid:id});if(error)return toast(error.message);
 if(data=='requested'){toast('Request sent. An admin will review it.');b.textContent='Requested';b.disabled=true;b.className='g'}else{if(data=='joined')toast('You joined the group');groupChat(id)}}
function pickSheet(title,btn,excl,withName,cb){SM=new Set();const s=sheet(`<b style="font-size:18px">${title}</b>${withName?'<input id="gnm" placeholder="Group name" maxlength="40" autocomplete="off">':''}<input id="gq" placeholder="Search people…" autocomplete="off"><div id="gpl" style="max-height:38vh;overflow:auto"></div><button style="width:100%;margin-top:10px" id="gok">${btn}</button>`);
 const load=async q=>{q=q.trim().replace(/[%,()]/g,'');let r=sb.from('profiles').select('*').neq('id',me.id).limit(40);if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);const {data}=await r;
  $('#gpl').innerHTML=(data||[]).filter(p=>!hid(p.id)&&!excl.has(p.id)).map(p=>`<div class="pk" data-id="${reg(p)}" style="display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer">${av(p)}<div style="flex:1;min-width:0"><div class="nm">${nm(p)}${vb(p)}</div><div class="mu">@${e(p.username)}</div></div><span class="ck ${SM.has(p.id)?'on':''}">${SM.has(p.id)?'✓':''}</span></div>`).join('')||'<p class="mu" style="padding:12px 0">No people found</p>';
  $('#gpl').querySelectorAll('.pk').forEach(el=>el.onclick=()=>{const id=el.dataset.id;SM.has(id)?SM.delete(id):SM.add(id);const c=el.querySelector('.ck');c.classList.toggle('on',SM.has(id));c.textContent=SM.has(id)?'✓':'';$('#gok').textContent=btn+(SM.size?' ('+SM.size+')':'')})};
 $('#gq').oninput=ev=>load(ev.target.value);load('');$('#gok').onclick=()=>cb(SM,withName?$('#gnm').value.trim():'',s)}
let SM=new Set(),GR={};
function newGroup(){pickSheet('New group','Create group',new Set(),true,async(sel,name,s)=>{if(!name)return toast('Enter a group name');
 const {data:gid,error}=await sb.rpc('create_group',{p_name:name});if(error)return toast(error.message);
 if(sel.size){const r=await sb.rpc('add_members',{p_gid:gid,p_uids:[...sel]});if(r.error)toast(r.error.message)}s.remove();groupChat(gid)})}
function confirmBox(t,m,b,fn){CF=fn;sheet(`<b style="font-size:18px">${t}</b><p class="mu" style="margin:8px 0 14px">${m}</p><button class="dg" style="width:100%" onclick="closeSheet();CF()">${b}</button><button class="g" style="width:100%;margin-top:8px" onclick="closeSheet()">Cancel</button>`)}
// ---- group info / admin tools ----
async function groupInfo(gid){tab='msg';chatWith=null;CH=null;const PF='id,username,full_name,avatar_url,verified,badge_visible,last_seen';
 const [{data:g},{data:mem},{data:req}]=await Promise.all([sb.from('groups').select('*').eq('id',gid).single(),sb.from('group_members').select(`role,joined_at,profiles!group_members_user_id_fkey(${PF})`).eq('group_id',gid).order('joined_at'),sb.from('group_requests').select(`created_at,profiles!group_requests_user_id_fkey(${PF})`).eq('group_id',gid).order('created_at')]);
 const mine=(mem||[]).find(m=>m.profiles.id==me.id);if(!g||!mine){toast('Group not available');return msg()}
 GR[gid]=g;mem.forEach(m=>reg(m.profiles));(req||[]).forEach(r=>reg(r.profiles));
 const isO=mine.role=='owner',isA=isO||mine.role=='admin',na=mem.filter(m=>m.role=='admin').length;GI={gid,role:mine.role,ids:new Set(mem.map(m=>m.profiles.id)),na};
 const chip=r=>r=='owner'?'<span class="chip o">Owner</span>':r=='admin'?'<span class="chip">Admin</span>':'';
 const can=m=>m.profiles.id!=me.id&&(isO||(isA&&m.role=='member'));
 shell('Group',`<div class="pcard"><div class="gi" style="width:84px;height:84px;border-radius:50%;font-size:34px;margin:0 auto">${gLetter(g)}</div>
  <div class="nm" style="justify-content:center;font-size:22px;margin-top:12px">${e(g.name)}</div><div class="mu" style="margin-top:2px">${mem.length} members${isA?` · Admins ${na}/5`:''}</div>
  ${isA?`<button class="g" style="margin-top:14px" onclick="renameG('${gid}')">Edit group name</button>`:''}</div>
  ${isA?`<div class="grp"><div class="sw"><div><div style="font-weight:700">Approve new members</div><div class="mu">Admins must approve join requests</div></div><button class="tg ${g.approval?'on':''}" onclick="togApprove('${gid}',this)"></button></div></div>`:''}
  ${isA&&(req||[]).length?`<div class="sec">Join requests (${req.length})</div><div class="grp">${req.map(r=>`<div class="sw"><div style="display:flex;align-items:center;gap:10px;min-width:0">${av(r.profiles)}<div style="min-width:0"><div class="nm">${nm(r.profiles)}${vb(r.profiles,14)}</div><div class="mu">@${e(r.profiles.username)}</div></div></div><div style="display:flex;gap:6px"><button style="padding:8px 12px" onclick="reqAct('${gid}','${r.profiles.id}',true)">Approve</button><button class="g" style="padding:8px 12px" onclick="reqAct('${gid}','${r.profiles.id}',false)">Decline</button></div></div>`).join('')}</div>`:''}
  <div class="sec" style="justify-content:space-between"><span>Members</span>${isA?`<button style="padding:7px 14px" onclick="addMem('${gid}')">Add</button>`:''}</div>
  <div class="grp">${mem.map(m=>`<div class="sw"><div style="display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer" onclick="openP('${m.profiles.id}')">${av(m.profiles)}<div style="min-width:0"><div class="nm">${nm(m.profiles)}${vb(m.profiles,14)}${chip(m.role)}</div><div class="mu">@${e(m.profiles.username)}</div></div></div>${can(m)?`<button class="p" onclick="memberMenu('${m.profiles.id}','${m.role}')">${ic('more',22,'currentColor')}</button>`:''}</div>`).join('')}</div>
  <div style="padding:0 12px"><button class="g" style="width:100%" onclick="groupChat('${gid}')">Back to chat</button>
  <button class="dg" style="width:100%;margin-top:10px" onclick="confirmBox('Leave group?','You will stop receiving messages from this group.','Leave',()=>leaveG('${gid}'))">Leave group</button>
  ${isO?`<button class="dg" style="width:100%;margin-top:10px" onclick="confirmBox('Delete group?','This deletes the group and all its messages for everyone.','Delete',()=>delG('${gid}'))">Delete group</button>`:''}</div>`,`<button class="ib" onclick="groupChat('${gid}')">${ic('back',20)}</button>`)}
function renameG(gid){ask('Group name','Name','text',async v=>{v=v.trim();if(!v)return;const {error}=await sb.from('groups').update({name:v}).eq('id',gid);if(error)return toast(error.message);GR[gid].name=v;groupInfo(gid)},GR[gid].name)}
async function togApprove(gid,b){const on=!b.classList.contains('on');const {error}=await sb.from('groups').update({approval:on}).eq('id',gid);if(error)return toast(error.message);b.classList.toggle('on',on);GR[gid].approval=on;toast(on?'New members need admin approval':'Anyone can join this group')}
async function reqAct(gid,uid,ok){const {error}=await sb.rpc('handle_request',{p_gid:gid,p_uid:uid,p_ok:ok});if(error)return toast(error.message);toast(ok?'Approved':'Declined');groupInfo(gid)}
function addMem(gid){pickSheet('Add members','Add',GI.ids,false,async(sel,_,s)=>{if(!sel.size)return toast('Select at least one person');const {error}=await sb.rpc('add_members',{p_gid:gid,p_uids:[...sel]});if(error)return toast(error.message);s.remove();toast('Members added');groupInfo(gid)})}
function memberMenu(uid,role){const g=GI.gid,isO=GI.role=='owner';const R=(t,fn,red)=>`<div class="sw" style="cursor:pointer;padding:14px 4px;${red?'color:#e0245e':''}" onclick="closeSheet();${fn}">${t}</div>`;
 sheet(`<b style="font-size:18px">${nm(PM[uid])}</b><div style="margin-top:6px">${R('View profile',`openP('${uid}')`)}
 ${isO&&role=='member'?R('Make admin',`setRole('${g}','${uid}','admin')`):''}${isO&&role=='admin'?R('Remove as admin',`setRole('${g}','${uid}','member')`):''}
 ${isO?R('Make owner',`confirmBox('Make this person the owner?','You will become an admin.','Make owner',()=>setRole('${g}','${uid}','owner'))`):''}
 ${R('Remove from group',`confirmBox('Remove member?','They will lose access to this group.','Remove',()=>kickG('${g}','${uid}'))`,1)}</div>`)}
async function setRole(g,u,r){const {error}=await sb.rpc('set_role',{p_gid:g,p_uid:u,p_role:r});if(error)return toast(error.message);toast('Updated');groupInfo(g)}
async function kickG(g,u){const {error}=await sb.rpc('kick_member',{p_gid:g,p_uid:u});if(error)return toast(error.message);toast('Member removed');groupInfo(g)}
async function leaveG(g){const {error}=await sb.rpc('leave_group',{p_gid:g});if(error)return toast(error.message);toast('You left the group');msgTab='g';go('msg')}
async function delG(g){const {error}=await sb.from('groups').delete().eq('id',g);if(error)return toast(error.message);toast('Group deleted');msgTab='g';go('msg')}
const chatBar=()=>`<div class="chatbar"><section id="vp" class="vp"></section><div><button class="cb" onclick="attachMenu()">${ic('clip',24)}</button><textarea id="mi" class="ta" rows="1" placeholder="Message…" oninput="grow(this)" onkeydown="kd(event,sendT)"></textarea><button class="cb" id="mic" onclick="rec()">${ic('mic',24)}</button><button class="sd" onclick="sendT()">${ic('up',22)}</button></div></div>`;
async function chat(id){const p=PM[id];chatWith=p;CH={k:'dm',p};app.style.paddingBottom='0';app.innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="ib" onclick="go('msg')">${ic('back')}</button><div style="display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0" onclick="openP('${p.id}')">${av(p)}<div style="min-width:0"><div class="nm">${nm(p)}${vb(p)}</div><div class="mu">${st(p)}</div></div></div></div></div>

 const {data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${p.id}),and(sender_id.eq.${p.id},receiver_id.eq.${me.id})`).order('created_at');
 $('#cm').innerHTML='';data.forEach(addBub);scrollEnd()}
async function groupChat(gid){tab='msg';
 const {data:mem}=await sb.from('group_members').select('role,profiles!group_members_user_id_fkey(id,username,full_name,avatar_url,verified,badge_visible,last_seen)').eq('group_id',gid);
 const mine=(mem||[]).find(m=>m.profiles.id==me.id);if(!mine){toast('You are not a member of this group');return msg()}
 let g=GR[gid];if(!g||g.owner_id===undefined){g=(await sb.from('groups').select('*').eq('id',gid).single()).data;if(!g)return msg();GR[gid]=g}
 mem.forEach(m=>reg(m.profiles));CH={k:'g',g,role:mine.role};chatWith={id:'g'+gid};app.style.paddingBottom='0';
 app.innerHTML=`<div class="top"><div style="display:flex;align-items:center;gap:10px;min-width:0"><button class="ib" onclick="go('msg')">${ic('back')}</button><div style="display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0" onclick="groupInfo('${gid}')"><div class="gi" style="width:42px;height:42px;border-radius:50%">${gLetter(g)}</div><div style="min-width:0"><div class="nm">${e(g.name)}</div><div class="mu">${mem.length} members · tap for group info</div></div></div></div></div>
 <div id="cm" class="pad" style="min-height:70vh"></div>${chatBar()}`;
 const {data}=await sb.from('group_messages').select('*').eq('group_id',gid).order('created_at',{ascending:false}).limit(300);
 $('#cm').innerHTML='';(data||[]).reverse().filter(m=>!hid(m.sender_id)).forEach(addBub);scrollEnd()}
function addBub(m){const c0=$('#cm');if(!c0)return;const mine=m.sender_id==me.id,g=CH&&CH.k=='g';let c=lk(m.body||'');
 if(m.media_type=='image')c=`<img src="${e(m.media_url)}">`;else if(m.media_type=='video')c=`<video src="${e(m.media_url)}" controls playsinline></video>`;else if(m.media_type=='audio')c=`<audio src="${e(m.media_url)}" controls></audio>`;
 else if(m.media_type=='file')c=`<div class="filec" data-u="${e(m.media_url)}" data-n="${e(m.body)}" onclick="dl(this.dataset.u,this.dataset.n)">${ic('dl',20)}<span>${e(m.body)}</span></div>`;
 if(m.media_type=='image'||m.media_type=='video')c+=`<div><button class="dlb" onclick="dl('${e(m.media_url)}')">${ic('dl',15)}Save</button></div>`;
 const sp=PM[m.sender_id],who=g&&!mine?`<div style="font-weight:800;font-size:12.5px;margin-bottom:2px;display:flex;align-items:center">${nm(sp||{username:'Member'})}${vb(sp,13)}</div>`:'';
 const can=g&&(mine||CH.role!='member');

let mr,chunks=[],vD=null,vT;
async function rec(){const b=$('#mic');
 if(mr&&mr.state=='recording'){mr.stop();return}
 try{const stm=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const mt=['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  mr=new MediaRecorder(stm,mt?{mimeType:mt,audioBitsPerSecond:128000}:undefined);chunks=[];vDiscard();
  mr.ondataavailable=x=>x.data.size&&chunks.push(x.data);
  mr.onstop=()=>{clearInterval(vT);stm.getTracks().forEach(t=>t.stop());b.innerHTML=ic('mic',24);b.style.color='';const type=mr.mimeType||'audio/webm',bl=new Blob(chunks,{type});vD={bl,type,ext:type.includes('mp4')?'m4a':'webm'};vPrev(URL.createObjectURL(bl))};
  mr.start();b.innerHTML=ic('stop',24);b.style.color='#ff2e7e';let s=0;const vp=$('#vp');vp.style.display='flex';
  const tick=()=>vp.innerHTML=`<span style="color:#ff2e7e;font-weight:700">Recording ${~~(s/60)}:${String(s%60).padStart(2,'0')} · tap stop when done</span>`;tick();vT=setInterval(()=>{s++;tick()},1000)}catch{toast('Please allow microphone access')}}

function cropImage(file){return new Promise(res=>{
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{const S=Math.min(innerWidth-48,360),o=document.createElement('div');o.className='crop';
  o.innerHTML=`<div class="cr-t">Move and zoom</div><div class="cr-s" style="width:${S}px;height:${S}px"><img class="cr-i" draggable="false"><div class="cr-m"></div></div><input type="range" class="cr-z" min="1" max="4" step="0.01" value="1"><div class="cr-b"><button class="g" id="crc">Cancel</button><button id="crd">Done</button></div>`;
  document.body.appendChild(o);
  const im=o.querySelector('.cr-i'),st=o.querySelector('.cr-s'),zr=o.querySelector('.cr-z');im.src=url;
  const w=img.naturalWidth,h=img.naturalHeight,base=Math.max(S/w,S/h);let z=1,cx=S/2,cy=S/2;
  const draw=()=>{const sc=base*z,iw=w*sc,ih=h*sc;cx=Math.min(S/2+(iw-S)/2,Math.max(S/2-(iw-S)/2,cx));cy=Math.min(S/2+(ih-S)/2,Math.max(S/2-(ih-S)/2,cy));im.style.width=iw+'px';im.style.height=ih+'px';im.style.left=(cx-iw/2)+'px';im.style.top=(cy-ih/2)+'px'};
  draw();const P=new Map();let d0=1,z0=1;
  st.onpointerdown=ev=>{st.setPointerCapture(ev.pointerId);P.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});if(P.size==2){const [a,b]=[...P.values()];d0=Math.hypot(a.x-b.x,a.y-b.y)||1;z0=z}};
  st.onpointermove=ev=>{const p=P.get(ev.pointerId);if(!p)return;if(P.size==1){cx+=ev.clientX-p.x;cy+=ev.clientY-p.y;p.x=ev.clientX;p.y=ev.clientY}else{p.x=ev.clientX;p.y=ev.clientY;const [a,b]=[...P.values()];z=Math.min(4,Math.max(1,z0*Math.hypot(a.x-b.x,a.y-b.y)/d0));zr.value=z}draw()};
  st.onpointerup=st.onpointercancel=ev=>P.delete(ev.pointerId);
  st.onwheel=ev=>{ev.preventDefault();z=Math.min(4,Math.max(1,z*(ev.deltaY<0?1.08:.93)));zr.value=z;draw()};
  zr.oninput=()=>{z=+zr.value;draw()};
  const done=v=>{o.remove();URL.revokeObjectURL(url);res(v)};
  o.querySelector('#crc').onclick=()=>done(null);
  o.querySelector('#crd').onclick=()=>{const sc=base*z,iw=w*sc,ih=h*sc,left=cx-iw/2,top=cy-ih/2,c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,512,512);g.drawImage(img,-left/sc,-top/sc,S/sc,S/sc,0,0,512,512);c.toBlob(b=>done(new File([b],'avatar.jpg',{type:'image/jpeg'})),'image/jpeg',.92)}};
 img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}

function enterRoom(gid,code,role){if(G)leaveRoom();G={game:gid||'ttt',code,role,opp:null,s:null,mk:role=='host'?'X':'O'};
 G.ch=sb.channel('room:'+code,{config:{broadcast:{self:false}}});
 G.ch.on('broadcast',{event:'m'},({payload})=>gmsg(payload)).subscribe(s=>{if(s=='SUBSCRIBED'&&role=='guest')gsend({t:'join',u:gUser()})});
 renderGame()}
function leaveRoom(){if(!G)return;try{gsend({t:'bye'})}catch{}sb.removeChannel(G.ch);G=null}
function gmsg(p){if(!G)return;
 if(p.t=='join'&&G.role=='host'){G.opp=p.u;G.s=null;initGame();gsend({t:'start',game:G.game,u:gUser()});toast(p.u.n+' joined');renderGame()}
 else if(p.t=='start'){G.game=p.game;G.opp=p.u;G.s=null;initGame();renderGame()}
 else if(p.t=='bye'){G.opp=null;toast('Opponent left');renderGame()}
 else if(p.t=='again'){G.s=null;initGame();drawGame()}
 else if(!G.s)return;
 else if(p.t=='move'){applyT(p.i,G.mk=='X'?'O':'X');drawGame()}
 else if(p.t=='pick'){G.s.o=p.c;checkR();drawGame()}
 else if(p.t=='next'){G.s.m='';G.s.o='';G.s.done=0;drawGame()}
 else if(p.t=='tap'){G.s.o=p.n;if(p.n>=30&&!G.s.w)G.s.w='o';G.s.w?drawGame():tapBars()}}
function initGame(){const g=G.game;G.s=g=='ttt'?{b:Array(9).fill(''),t:'X',w:''}:g=='rps'?{m:'',o:'',sc:[0,0],done:0}:{m:0,o:0,w:''}}

function renderGame(){const g=GM[G.game];let b;
 if(!G.opp)b=G.role=='host'?`<div class="pad" style="text-align:center"><p class="mu">Waiting for a friend to join…</p><div class="code">${G.code}</div><p class="mu">Share this code, or invite someone below</p><input id="gs" placeholder="Search a friend to invite" oninput="gsrch(this.value)" autocomplete="off" style="margin-top:14px"><div id="gl" style="text-align:left"></div></div>`

 else b=`<div class="pad"><div class="mu" style="text-align:center;margin-bottom:12px">You vs <b style="color:var(--tx)">${e(G.opp.n)}</b></div><div id="gb"></div></div>`;
 shell(g.n,b,`<button class="ib" onclick="go('games')">${ic('back',20)}</button>`);
 if(G.opp)drawGame();else if(G.role=='host')gsrch('')}
async function gsrch(q){q=q.trim().replace(/[%,()]/g,'');let r=sb.from('profiles').select('*').neq('id',me.id).limit(20);if(q)r=r.or(`username.ilike.%${q}%,full_name.ilike.%${q}%`);const {data}=await r;const gl=$('#gl');if(!gl)return;
 gl.innerHTML=(data||[]).filter(p=>!hid(p.id)).map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:8px 0">${av(p)}<div style="flex:1"><div class="nm">${nm(p)}${vb(p)}</div><div class="mu">${st(p)}</div></div><button onclick="invite('${reg(p)}')" style="padding:8px 14px">Invite</button></div>`).join('')}
function invite(uid){const c=sb.channel('inv:'+uid);c.subscribe(s=>{if(s=='SUBSCRIBED'){c.send({type:'broadcast',event:'invite',payload:{n:nmr(prof),game:G.game,code:G.code,from:me.id}});setTimeout(()=>sb.removeChannel(c),1500);toast('Invite sent. They need to be online.')}})}
const LN=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function applyT(i,m){const s=G.s;if(s.w||s.b[i])return;s.b[i]=m;if(LN.some(l=>l.every(k=>s.b[k]==m)))s.w=m;else if(s.b.every(x=>x))s.w='D';s.t=m=='X'?'O':'X'}
function tmove(i){if(!G||!G.s||G.s.w||G.s.b[i]||G.s.t!=G.mk)return;applyT(i,G.mk);gsend({t:'move',i});drawGame()}
function rpick(c){if(!G.s||G.s.m)return;G.s.m=c;gsend({t:'pick',c});checkR();drawGame()}
function checkR(){const s=G.s;if(!s.m||!s.o||s.done)return;s.done=1;const W={R:'S',S:'P',P:'R'};if(s.m==s.o)s.res='Draw';else if(W[s.m]==s.o){s.res='You win this round';s.sc[0]++}else{s.res='You lose this round';s.sc[1]++}}
function rnext(){G.s.m='';G.s.o='';G.s.done=0;gsend({t:'next'});drawGame()}
function tapGo(){const s=G.s;if(s.w)return;s.m++;gsend({t:'tap',n:s.m});if(s.m>=30){s.w='m';drawGame()}else tapBars()}
function tapBars(){const s=G.s,a=$('#bm'),b=$('#bo');if(a)a.style.width=s.m/30*100+'%';if(b)b.style.width=s.o/30*100+'%';const c=$('#tc');if(c)c.textContent=s.m+' / 30'}
function drawGame(){const el=$('#gb');if(!el||!G||!G.s)return;const s=G.s;
 if(G.game=='ttt'){const my=G.mk,msg=s.w=='D'?'Draw':s.w?(s.w==my?'You win!':'You lose'):(s.t==my?'Your turn ('+my+')':"Opponent's turn");
  el.innerHTML=`<div style="text-align:center;font-weight:800;font-size:18px;margin-bottom:14px">${msg}</div><div class="tt">${s.b.map((c,i)=>`<button class="${c}" onclick="tmove(${i})">${c}</button>`).join('')}</div>${s.w?`<button style="width:100%;margin-top:16px" onclick="again()">Play again</button>`:''}`}
 else if(G.game=='rps'){const E={R:'✊',P:'✋',S:'✌️'},over=s.sc[0]>=3||s.sc[1]>=3;
  el.innerHTML=`<div style="text-align:center;font-weight:800;font-size:18px;margin-bottom:6px">You ${s.sc[0]} : ${s.sc[1]} ${e(G.opp.n)}</div>
  ${s.done?`<div style="text-align:center;font-size:44px;margin:14px 0">${E[s.m]} vs ${E[s.o]}</div><div style="text-align:center;font-weight:700">${over?(s.sc[0]>=3?'You won the match!':'You lost the match'):s.res}</div>${over?`<button style="width:100%;margin-top:16px" onclick="again()">Play again</button>`:`<button style="width:100%;margin-top:16px" onclick="rnext()">Next round</button>`}`
  :`<p class="mu" style="text-align:center;margin:10px 0 16px">${s.m?'Waiting for opponent…':'Pick one'}</p><div class="rps">${['R','P','S'].map(c=>`<button onclick="rpick('${c}')" style="${s.m==c?'outline:3px solid #ff2e7e':''}">${E[c]}</button>`).join('')}</div>`}`}
 else{el.innerHTML=`<div style="text-align:center;font-weight:800;font-size:18px">${s.w?(s.w=='m'?'You win!':'You lose'):'Tap as fast as you can!'}</div>
  <div class="mu" style="margin-top:12px">You <span id="tc">${s.m} / 30</span></div><div class="bar"><i id="bm" style="width:${s.m/30*100}%"></i></div><div class="mu">${e(G.opp.n)}</div><div class="bar"><i id="bo" style="width:${s.o/30*100}%"></i></div>
  ${s.w?`<button style="width:100%;margin-top:6px" onclick="again()">Play again</button>`:`<button class="tapbtn" onpointerdown="tapGo()">TAP</button>`}`}}

let ly=0;addEventListener('scroll',()=>{const t=$('.top'),y=scrollY;if(t&&!chatWith){if(y>ly+8&&y>70)t.classList.add('hide');else if(y<ly-8||y<70)t.classList.remove('hide')}ly=y},{passive:true});
if(SB_URL.startsWith('YOUR'))app.innerHTML='<div class="auth"><div class="brand" style="font-size:40px;justify-content:center">Open<b>Tap</b></div><p style="margin-top:24px">Add your <b>SB_URL</b> and <b>SB_KEY</b> at the top of this file.</p></div>';else boot();
</script></body></html>
